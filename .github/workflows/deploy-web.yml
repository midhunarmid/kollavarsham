# Deploys calendar.armid.in to GitHub Pages on every push to main: the
# static site (apps/site) at the root and the Flutter web app
# (apps/calendar) at /app/.
#
# One-time setup: repository Settings > Pages > Build and deployment >
# Source: "GitHub Actions", and Custom domain: calendar.armid.in (DNS: a
# CNAME record pointing to midhunarmid.github.io).
name: Deploy web

on:
  push:
    branches: [main]
  # Every day at 01:00 IST (19:30 UTC), so the build-day lists (upcoming
  # festivals, the current year's links) and the data range stay current
  # without a push. GitHub pauses schedules after 60 days without commits;
  # the uptime workflow reports a stale deploy.
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: flutter pub get
      - name: Test the app
        working-directory: apps/calendar
        run: flutter test
      - name: Site data and JS converter
        working-directory: apps/site
        run: npm run prepare-data
      - name: Build the site
        working-directory: apps/site
        run: |
          npm ci
          npm run build
          npm run check
      - name: Build the web app at /app/
        working-directory: apps/calendar
        # Local CanvasKit (no CDN), so the app can work offline.
        run: |
          flutter build web --release --base-href /app/ --no-web-resources-cdn
          cp -r build/web ../site/dist/app
          touch ../site/dist/.nojekyll
      - name: Check the app opens offline
        working-directory: apps/site
        run: node scripts/check-offline.mjs /usr/bin/google-chrome
      - name: Lighthouse (site scores, web app size and load time)
        working-directory: apps/site
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx --yes @lhci/cli@0.16.0 autorun
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: apps/site/.lighthouseci/reports
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
