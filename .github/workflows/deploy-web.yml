# Deploys calendar.armid.in to GitHub Pages on every push to main: the
# static site (apps/site) at the root and the Flutter web app
# (apps/calendar) at /app/.
#
# One-time setup: repository Settings > Pages > Build and deployment >
# Source: "GitHub Actions", and Custom domain: calendar.armid.in (DNS: a
# CNAME record pointing to midhunarmid.github.io).
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: flutter pub get
      - name: Test the app
        working-directory: apps/calendar
        run: flutter test
      - name: Site data and JS converter
        working-directory: apps/site
        run: npm run prepare-data
      - name: Build the site
        working-directory: apps/site
        run: |
          npm ci
          npm run build
          npm run check
      - name: Build the web app at /app/
        working-directory: apps/calendar
        run: |
          flutter build web --release --base-href /app/
          cp -r build/web ../site/dist/app
          touch ../site/dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
