name: kollavarsham
description: >-
  Malayalam calendar (Kollavarsham / Malayalam Era) for Dart. Convert between
  Gregorian and Malayalam dates, with month names, nakshatra, tithi and
  Malayalam numerals.
version: 0.1.0-dev
repository: https://github.com/midhunarmid/kollavarsham
topics:
  - calendar
  - malayalam
  - date
  - kerala
  - astronomy

environment:
  sdk: ^3.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
