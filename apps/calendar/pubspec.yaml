name: calendar
description: Malayalam Calendar (Kollavarsham) app for Android and the web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: any
  kollavarsham_flutter: ^1.0.0
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  workmanager: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
    # Copies of data/holidays/*.json; refresh with tool/sync_holidays.dart.
    - assets/holidays/
  fonts:
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
