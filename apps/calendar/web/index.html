<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Malayalam calendar with panchangam, festivals and star-birthday (pirannal) reminders. Works offline; your data stays in this browser.">
  <meta name="theme-color" content="#00796b">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Malayalam Calendar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Malayalam Calendar</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while Flutter loads; removed at its first frame. */
    html, body { margin: 0; background: #f6faf9; }
    #splash {
      position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
      gap: 16px; font: 600 20px/1.3 system-ui, sans-serif; color: #17302c; text-align: center;
    }
    #splash .mark {
      width: 64px; height: 64px; border-radius: 18px; background: #00796b; color: #fff;
      display: grid; place-items: center; font-size: 34px;
    }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; background: #cfe4e0; overflow: hidden; }
    #splash .bar::after {
      content: ''; display: block; width: 40%; height: 100%; background: #00796b;
      animation: splash 1.1s ease-in-out infinite;
    }
    @keyframes splash { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0f1615; }
      #splash { color: #dce8e5; }
      #splash .bar { background: #24403b; }
    }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">൧</div>
    <div>Malayalam Calendar · മലയാളം കലണ്ടർ</div>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- IndexedDB, storage persistence, install and update hooks for Dart. -->
  <script src="browser.js"></script>
  <script src="flutter_bootstrap.js" async></script>
  <!-- Offline support: our own service worker (Flutter's is retired). -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('app_sw.js').catch(function (e) {
          console.warn('Service worker not registered:', e);
        });
      });
    }
  </script>
</body>
</html>
